#
# VM2 (Application Server): Spring Boot backend + PostgreSQL (+ required MinIO).
#
# Run on VM2:
#   docker compose -f docker-compose.vm2.yml up --build -d
#
# Ports:
# - 8090: main HTTP API
# - 9091: Actuator (health + Prometheus metrics)
#
# Security note:
# - Expose 9091 only to VM1 (Prometheus) via firewall/security group.
#

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "9091:9091"
    # Load required configuration from a .env file on VM2.
    # (Do not commit your real .env with secrets.)
    env_file:
      - .env
    environment:
      SERVER_ADDRESS: "0.0.0.0"

      # PostgreSQL
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/chat_monolith}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-chat}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-chat}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}"

      # Mail:
      # The app currently requires JavaMailSender to exist at startup.
      # If you have real SMTP, set SPRING_MAIL_* and remove the mailpit service.
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-mailpit}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-1025}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}"

      # WebSocket allowed origins:
      # Override these to your VM1/frontend URLs.
      SPRING_APPLICATION_JSON: "${SPRING_APPLICATION_JSON:-{\"app\":{\"websocket\":{\"allowedOrigins\":[\"http://localhost:8081\",\"http://127.0.0.1:8081\"]}}}}"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      # Uses same defaults as the postgres service above.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:-chat}@postgres:5432/${POSTGRES_DB:-chat_monolith}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - /:/host:ro,rslave

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-chat_monolith}"
      POSTGRES_USER: "${POSTGRES_USER:-chat}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-chat}"
    # Typically you do NOT need to expose Postgres publicly.
    # Uncomment only if you need to connect from outside VM2.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Optional: expose for debugging. Otherwise keep internal.
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minio12345}"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_URL: "${MINIO_URL:-http://minio:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio12345}"
      MINIO_BUCKET: "${MINIO_BUCKET:-pictures}"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        mc alias set local "$${MINIO_URL}" "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb -p "local/$${MINIO_BUCKET}" || true
        mc anonymous set download "local/$${MINIO_BUCKET}" || true

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    # Optional: expose UI for debugging.
    # ports:
    #   - "8025:8025"
    #   - "1025:1025"

volumes:
  postgres_data:
  minio_data:

