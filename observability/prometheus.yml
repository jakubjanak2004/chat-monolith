#
# Prometheus config for local docker-compose.
# Scrapes the Spring Boot app's actuator Prometheus endpoint.
#
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: chat-monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8090"]
