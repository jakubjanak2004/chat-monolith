# app configs
spring.application.name=chat-monolith
server.port=8090

# --- Observability (Prometheus / Grafana) ---
# Exposes metrics at /actuator/prometheus for Prometheus to scrape.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Run Actuator endpoints on a separate port (metrics stay off the main app port).
# We'll keep health checks on the main port via a small controller.
management.server.port=9091
management.server.address=0.0.0.0

# Enable Prometheus histogram buckets for HTTP server request latency.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# database
spring.datasource.url=jdbc:postgresql://localhost:5432/chat_monolith
spring.datasource.username=chat
spring.datasource.password=chat
spring.jpa.hibernate.ddl-auto=create-drop
spring.config.import=optional:classpath:local.properties

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# mails
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true