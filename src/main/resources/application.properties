# app configs
spring.application.name=chat-monolith
server.port=8090

# --- Observability (Prometheus / Grafana) ---
# Exposes metrics at /actuator/prometheus for Prometheus to scrape.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Enable Prometheus histogram buckets for HTTP server request latency.
# This is required for queries like:
#   histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le))
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.config.import=optional:classpath:local.properties

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# mails
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true